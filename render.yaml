# Render Blueprint - backend service.
#
# This uses a container rather than Render's native Python runtime because
# Tesseract (screenshot OCR) is a system binary and the native runtime cannot
# install system packages. The image installs it; everything else is unchanged.
services:
  - type: web
    name: scamsense-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CORS_ORIGINS
        sync: false        # set to your Vercel origin, e.g. https://your-app.vercel.app
      - key: AUTH_SECRET
        generateValue: true  # without it, every restart invalidates all sessions
      - key: ADMIN_API_KEY
        sync: false          # unset keeps /admin disabled (returns 503)
      - key: SUPABASE_URL
        sync: false          # unset = in-memory storage (history lost on restart)
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "120"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      # Local Ollama is not reachable from a cloud host, so /analyze uses the
      # deterministic engine there. Only affects the narrative, not the score.
      - key: OLLAMA_HOST
        value: "http://127.0.0.1:11434"